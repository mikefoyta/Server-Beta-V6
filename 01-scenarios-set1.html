<body>

<header>
  <h1>CompTIA Server+ V6 (SK1-006) — 100 Scenario Master Vault</h1>
  <p>5-Domain Edition (including AI Infrastructure &amp; Acceleration) • Dark-Navy Mobile Train Reader with instant root-cause explanations and exam triggers.</p>

<div class="controls">
  <div class="filter-row" id="filterRow">
    <button class="chip active" data-domain="ALL">All (100)</button>
    <button class="chip" data-domain="1.0 Hardware & Infrastructure">1.0 Hardware (20)</button>

<main id="quizContainer"></main>

<script>
const scenarios = [
  // ================= DOMAIN 1.0: HARDWARE & INFRASTRUCTURE (1-20) =================
  {
    id: 1, domain: "1.0 Hardware & Infrastructure",
    q: "A multi-socket enterprise server running a high-transaction database exhibits high memory latency when threads on CPU Socket 1 frequently access RAM modules populated on CPU Socket 2's memory controller. Which feature should be tuned or verified?",
    opts: ["A. NUMA (Non-Uniform Memory Access) node affinity and process memory interleaving", "B. Disabling ECC parity checking to reduce pipeline stalls", "C. Switching BIOS memory mode from Independent Channel to Mirroring", "D. Increasing the OS page file size on the secondary SAN LUN"],
    ans: "A",
    why: "In multi-socket servers, each CPU owns its local memory controller. Accessing RAM attached to another socket traverses the inter-socket interconnect (UPI/Infinity Fabric), adding latency. NUMA affinity keeps threads pinned to local RAM.",
    trap: "Cross-socket memory latency = NUMA node affinity."
  },
  {
    id: 2, domain: "1.0 Hardware & Infrastructure",
    q: "An engineer populates 8 identical 32 GB RDIMMs into a single-socket server with 16 DIMM slots (8 channels, 2 slots per channel). All 8 sticks are placed into Channels A–D (filling both slots per channel) while Channels E–H remain empty. Throughput drops by 45%. Why?",
    opts: ["A. The motherboard automatically enabled Memory Sparing mode", "B. Half of the CPU's memory channels are idle, cutting aggregate memory bandwidth in half", "C. Populating 2 DIMMs per channel forces single-rank mode", "D. ECC scrubbing consumes half the bus cycles when slots are paired"],
    ans: "B",
    why: "An 8-channel CPU achieves full bandwidth by interleaving across all 8 channels simultaneously (1 DIMM in the primary slot of each channel). Leaving 4 channels empty halves parallel bus width.",
    trap: "Always populate the primary slot of EVERY channel before populating the second slot of any channel."
  },
  {
    id: 3, domain: "1.0 Hardware & Infrastructure",
    q: "After installing 24 RDIMMs (populating 2 DIMMs per channel across a 12-channel dual-socket server), the technician notices in UEFI BIOS that memory speed stepped down from 4800 MT/s to 4400 MT/s despite all sticks being rated for 4800 MT/s. Why?",
    opts: ["A. One DIMM has a faulty thermal sensor", "B. Normal 2DPC (two DIMMs per channel) electrical loading step-down to preserve signal integrity", "C. The BMC throttled RAM because PSUs are in Cold Redundancy mode", "D. Mixing ranks disables memory profiles"],
    ans: "B",
    why: "Sharing one electrical memory channel between two DIMMs increases capacitive load and signal reflection. Memory controllers intentionally step down clock frequency at 2DPC to prevent bit errors.",
    trap: "Expected 2DPC physics—do not RMA healthy RAM."
  },
  {
    id: 4, domain: "1.0 Hardware & Infrastructure",
    q: "A technician upgrades server memory by adding eight 32 GB LRDIMMs alongside eight existing 32 GB RDIMMs. Upon powering on, the server halts during POST with a memory configuration error. Why?",
    opts: ["A. LRDIMMs require a dedicated PCIe riser power cable", "B. RDIMMs and LRDIMMs use incompatible electrical buffering architectures and cannot be mixed", "C. LRDIMMs only operate in 1DPC configurations", "D. Registered memory must be installed in lower-numbered slots"],
    ans: "B",
    why: "RDIMMs buffer only command/address lines, whereas LRDIMMs buffer data lines too via an isolation buffer chip. The memory controller cannot drive both types together.",
    trap: "Never mix UDIMM, RDIMM, and LRDIMM—or ECC and non-ECC."
  },
  {
    id: 5, domain: "1.0 Hardware & Infrastructure",
    q: "A 2U rackmount server undergoes routine fan replacement. After closing the lid, fans ramp to 100% RPM and CPUs thermally throttle within 10 minutes despite 19°C intake air. What was forgotten?",
    opts: ["A. Reinstalling the internal plastic air baffle/shroud over the CPUs and DIMMs", "B. Updating the BMC SSL certificate", "C. Installing blanking panels in the adjacent rack", "D. Enabling Dynamic Fan Curve in the OS"],
    ans: "A",
    why: "Without the plastic air shroud channeling airflow tightly over passive CPU heatsinks and DIMMs, cool air bypasses the fins over the top of the chassis.",
    trap: "Air baffle/shroud goes on LAST in every internal server build."
  },
  {
    id: 6, domain: "1.0 Hardware & Infrastructure",
    q: "An out-of-band BMC (iDRAC/iLO) reports 'PSU 2: Standby / Input Lost' while PSU 1 carries 100% of the load. Both power cords are firmly seated. What should be checked next?",
    opts: ["A. Whether PSU 2 is connected to a separate PDU/breaker circuit that has tripped or lost feed", "B. Whether BIOS Power Policy is set to Maximum Performance", "C. Whether the CMOS battery dropped below 2.8V", "D. Whether PCIe ASPM is disabled"],
    ans: "A",
    why: "'Input Lost' means zero AC voltage is arriving at the PSU inlet, pointing directly to the upstream PDU outlet, power whip, or branch breaker on Feed B.",
    trap: "Input Lost = upstream PDU/circuit issue; PSU Failure = dead power supply unit."
  },
  {
    id: 7, domain: "1.0 Hardware & Infrastructure",
    q: "A rack has two 20A / 120V circuits (Feed A and Feed B) supplying dual-PSU servers drawing 1,800W total steady-state load (900W per feed). What happens if Feed A loses utility power?",
    opts: ["A. Servers remain online because Feed B safely absorbs the full 1,800W load under its 1,920W continuous limit", "B. Feed B's breaker trips immediately", "C. Half the servers reboot", "D. PDUs shed non-critical outlets"],
    ans: "A",
    why: "A 20A × 120V circuit provides 2,400W peak and 1,920W continuous (80% NEC rule). When Feed A dies, Feed B picks up 1,800W—staying safely beneath 1,920W.",
    trap: "Size each A/B feed to carry 100% of rack load within the 80% continuous ceiling."
  },
  {
    id: 8, domain: "1.0 Hardware & Infrastructure",
    q: "An x16 PCIe Gen 4 NVMe carrier card is installed in a physical x16 motherboard slot, yet throughput caps at half speed. The manual states the slot is 'x16 physical, x8 electrical'. Why?",
    opts: ["A. Only 8 PCIe data lanes are physically wired from the slot to the CPU/chipset", "B. The slot supplies only 3.3V standby power", "C. The slot downgrades Gen 4 to Gen 2", "D. Bifurcation must be disabled"],
    ans: "A",
    why: "Physical slot length determines mechanical fit, whereas electrical wiring (x8) dictates actual data lanes routed to the PCIe root complex.",
    trap: "Physical slot size ≠ electrical lane width."
  },
  {
    id: 9, domain: "1.0 Hardware & Infrastructure",
    q: "A dual-socket server fails to detect a NIC installed in PCIe Slot 4. All other slots work. The block diagram shows Slot 4 routes to CPU Socket 2, which is empty. Why is Slot 4 dead?",
    opts: ["A. PCIe slots mapped to an unpopulated CPU socket have no active PCIe root complex lanes", "B. Single-CPU servers require a terminator card in Socket 2", "C. Slot 4 is reserved for RAID controllers", "D. ACPI multi-processor drivers are missing"],
    ans: "A",
    why: "Modern server CPUs integrate the PCIe root complex onto the CPU die. Without CPU 2 installed, all DIMMs and PCIe slots wired to Socket 2 are electrically disconnected.",
    trap: "Single-CPU build in a 2-socket chassis = only use DIMMs and risers tied to CPU 1."
  },
  {
    id: 10, domain: "1.0 Hardware & Infrastructure",
    q: "A server reboots randomly, and the BMC System Event Log records 'Uncorrectable Multi-Bit ECC Memory Error on DIMM_B2'. Which action permanently fixes it?",
    opts: ["A. Replace the faulty DIMM module in slot B2", "B. Clear the SEL log and enable Patrol Scrubbing", "C. Swap DIMM_B2 with DIMM_A1", "D. Lower memory refresh rate in BIOS"],
    ans: "A",
    why: "Single-bit ECC errors are corrected automatically; multi-bit errors cannot be corrected and trigger fatal machine check reboots until the defective DIMM is replaced.",
    trap: "Multi-bit ECC error = immediate DIMM replacement."
  },
  {
    id: 11, domain: "1.0 Hardware & Infrastructure",
    q: "An administrator enables BIOS Memory Mirroring on a server with 256 GB of physical RAM to protect an in-memory database. How much usable RAM does the OS see?",
    opts: ["A. 128 GB", "B. 192 GB", "C. 224 GB", "D. 256 GB"],
    ans: "A",
    why: "Memory Mirroring operates like RAID 1 for RAM—half the channels mirror the other half in real time, giving 50% usable capacity.",
    trap: "Memory Mirroring = 50% capacity; Memory Sparing = reserves 1 rank per channel."
  },
  {
    id: 12, domain: "1.0 Hardware & Infrastructure",
    q: "Intake temperatures rise near the middle of a 42U rack despite normal CRAC cooling. Inspection reveals three empty 4U gaps with no equipment or covers. Why is it overheating?",
    opts: ["A. Hot rear exhaust air is recirculating through the open U-spaces back into the front cold aisle", "B. Static electricity in empty rails heats the steel frame", "C. Cold air sinks too fast to 1U", "D. Vertical PDUs block rear exhaust"],
    ans: "A",
    why: "Server front fans create negative pressure that sucks hot exhaust air straight through unsealed rack gaps unless blanking panels are installed.",
    trap: "Empty rack slots = install blanking panels to stop hot-air recirculation."
  },
  {
    id: 13, domain: "1.0 Hardware & Infrastructure",
    q: "When populating an empty 42U rack with a heavy UPS, four 2U servers, two 1U ToR switches, and a patch panel, which layout follows best practices?",
    opts: ["A. UPS at 1U–4U (bottom), servers in 15U–22U (middle), switches and patch panel at 39U–42U (top)", "B. Switches at 1U–3U, servers in 10U–17U, UPS at 38U–42U", "C. UPS at 20U–23U, switches at 18U–19U, servers at 1U–8U", "D. Alternate UPS and servers every 4U"],
    ans: "A",
    why: "Heavy battery units and SAN shelves go at the bottom (1U–10U) to prevent top-heavy rack tip-over; compute sits at waist height; lightweight network gear sits at the top.",
    trap: "Heavy bottom, compute middle, network top."
  },
  {
    id: 14, domain: "1.0 Hardware & Infrastructure",
    q: "Four NVMe U.2 drives are installed in a server's front bays, but only two appear in the OS. Specs confirm all four work if PCIe bifurcation is enabled on Slot 1. What does PCIe bifurcation do?",
    opts: ["A. Splits one wide x16 PCIe link into four independent x4 links so each NVMe drive gets dedicated lanes", "B. Mirrors two NVMe namespaces", "C. Merges two x8 slots into x16", "D. Converts SAS to NVMe"],
    ans: "A",
    why: "Each direct-attached NVMe drive needs 4 PCIe lanes (x4). Bifurcation splits a single x16 root port into x4/x4/x4/x4 in UEFI.",
    trap: "Missing NVMe drives on a multi-drive riser = enable PCIe bifurcation."
  },
  {
    id: 15, domain: "1.0 Hardware & Infrastructure",
    q: "A data center drops to 12% relative humidity in winter, leading to component failures during hardware maintenance even with ESD straps worn. Why?",
    opts: ["A. Ultra-low humidity dramatically increases electrostatic discharge (ESD) buildup", "B. Dry air crystallizes thermal paste", "C. Fans lose aerodynamic lift", "D. Fiber lasers drift below 20% humidity"],
    ans: "A",
    why: "ASHRAE recommends 40%–60% RH (allowable 20%–80%). Below 20%, static electricity cannot dissipate naturally, spiking ESD damage risk.",
    trap: "Low humidity = ESD; high humidity = condensation/corrosion."
  },
  {
    id: 16, domain: "1.0 Hardware & Infrastructure",
    q: "A storage server has 24 hot-swap bays with 10 drives installed. Removing the 14 empty plastic drive trays causes drive temperatures to jump 9°C. Why?",
    opts: ["A. Removing drive blanks destroys static air pressure, letting cool air bypass the active drives", "B. Empty bays draw phantom current", "C. RAID controllers disable PWM fans when bays are empty", "D. Plastic trays act as heatsinks"],
    ans: "A",
    why: "Empty open drive bays act like air leaks, dropping static pressure across the tightly spaced active drives.",
    trap: "Always keep filler blanks in unpopulated drive bays."
  },
  {
    id: 17, domain: "1.0 Hardware & Infrastructure",
    q: "During a battery test, an online UPS shows '100% Charge' at idle, switches to battery, and immediately drops its load within 5 seconds. Why?",
    opts: ["A. Aged battery cells developed high internal resistance and collapsed under real wattage draw", "B. The bypass relay fused open", "C. Server PSUs rejected pure sine wave AC", "D. The PDU tripped on ground fault"],
    ans: "A",
    why: "Degraded lead-acid/VRLA batteries can still hold open-circuit float voltage (reading 100%) while having zero capacity under real load.",
    trap: "Float voltage ≠ load capacity; load-test and replace UPS batteries every 3–5 years."
  },
  {
    id: 18, domain: "1.0 Hardware & Infrastructure",
    q: "A server powers on (fans spin) with no video and no POST beeps immediately after upgrading to a newer stepping of a compatible CPU family. What was likely missed?",
    opts: ["A. Updating UEFI BIOS firmware beforehand so it contains the newer CPU's microcode", "B. Installing SMP kernel drivers in the OS", "C. Flashing SAS HBA firmware", "D. Replacing the CMOS battery"],
    ans: "A",
    why: "Newer CPU steppings/refreshes require updated microcode in the UEFI BIOS before the processor can initialize RAM and POST.",
    trap: "Flash BIOS BEFORE installing newer-stepping CPUs."
  },
  {
    id: 19, domain: "1.0 Hardware & Infrastructure",
    q: "A server uses four 1200W Platinum PSUs in N+1 mode. During low overnight loads, the BMC puts two PSUs into 'Cold Redundancy' standby. Why?",
    opts: ["A. Concentrating load onto two PSUs pushes them into their ~50% peak efficiency sweet spot, saving power and heat", "B. Turning off PSUs prevents transformer harmonics", "C. Cold redundancy boosts CPU turbo clocks", "D. Standby PSUs reverse fans to cool the rack"],
    ans: "A",
    why: "PSUs are inefficient below 20% load. Cold Redundancy parks extra PSUs in microsecond-wake standby so active PSUs run near peak 50% efficiency.",
    trap: "Cold Redundancy = efficiency optimization without losing failover."
  },
  {
    id: 20, domain: "1.0 Hardware & Infrastructure",
    q: "Connecting a server serial console port to a terminal server with a straight-through Cat6 cable shows a blank screen. What cable is required?",
    opts: ["A. A rollover / null-modem serial cable that crosses Transmit (TX) and Receive (RX) pins", "B. An LC-to-SC single-mode fiber patch cable", "C. A Gigabit Ethernet crossover cable", "D. An active VGA-to-HDMI adapter"],
    ans: "A",
    why: "RS-232 serial ports do not have Auto-MDIX; TX on one device must cross over to RX on the other via a rollover or null-modem cable.",
    trap: "Serial console = rollover / null-modem cable."
  },

  // ================= DOMAIN 2.0: SERVER ADMINISTRATION & STORAGE (21-40) =================
  {
    id: 21, domain: "2.0 Server Administration",
    q: "An administrator configures Multipath I/O (MPIO) on a server connected to a dual-controller SAN. During heavy I/O, one path develops high latency due to a degraded optic, yet transfers continue smoothly. Which MPIO policy dynamically routes I/O away from congested paths by monitoring queued requests?",
    opts: ["A. Least Queue Depth (LQD)", "B. Failover Only", "C. Round Robin", "D. Fixed Path"],
    ans: "A",
    why: "Round Robin sends I/O blindly to slow paths too. Least Queue Depth inspects pending I/O queues per path and dispatches requests to the least congested link.",
    trap: "Avoid degraded/congested SAN paths = Least Queue Depth."
  },
  {
    id: 22, domain: "2.0 Server Administration",
    q: "A storage pool contains six 4 TB SAS drives and two 2 TB SAS drives. Creating a single RAID 6 virtual disk across all eight drives without spares yields what usable capacity?",
    opts: ["A. 12 TB", "B. 16 TB", "C. 20 TB", "D. 24 TB"],
    ans: "A",
    why: "Hardware RAID truncates every drive to the smallest disk in the pool (2 TB). Eight drives at 2 TB minus 2 parity drives = 6 × 2 TB = 12 TB usable.",
    trap: "Always multiply by the SMALLEST drive size first, then subtract parity drives."
  },
  {
    id: 23, domain: "2.0 Server Administration",
    q: "A 10-drive RAID 10 array (five 2-drive mirror pairs) loses Drive 0 (in Mirror Pair 1) and Drive 7 (in Mirror Pair 4) simultaneously. What is the array status?",
    opts: ["A. Remains online in a degraded state with all data intact", "B. Goes offline immediately with total data loss", "C. Automatically converts to RAID 5", "D. Becomes permanently read-only"],
    ans: "A",
    why: "RAID 10 survives up to one failed drive PER mirror pair. Because the failures occurred in different pairs, both surviving twins keep serving data.",
    trap: "RAID 10: Different pairs = alive; Same pair = dead."
  },
  {
    id: 24, domain: "2.0 Server Administration",
    q: "An 8-drive RAID 5 array of 8 TB drives loses one disk. Halfway through the 18-hour rebuild onto a hot spare, an Unrecoverable Read Error (URE) hits another drive. What happens?",
    opts: ["A. The RAID 5 rebuild fails and the entire volume is lost", "B. The controller skips the bad sector and finishes cleanly", "C. The array degrades to RAID 0", "D. The hot spare mirrors healthy disks first"],
    ans: "A",
    why: "RAID 5 tolerates only ONE drive fault. Hitting an unreadable sector during a full-disk parity rebuild creates a second simultaneous fault, collapsing the array—why RAID 6 is required for large drives.",
    trap: "Large multi-TB drives + RAID 5 = URE rebuild failure risk → use RAID 6."
  },
  {
    id: 25, domain: "2.0 Server Administration",
    q: "iSCSI storage latency spikes every morning at 9:00 AM when office users log onto the shared 10GbE switch. Which two configuration changes best isolate and optimize iSCSI traffic?",
    opts: ["A. Move iSCSI onto a dedicated non-routed VLAN/subnet and enable Jumbo Frames (MTU 9000) end-to-end", "B. Enable RIPv2 on iSCSI NICs and lower MTU to 576", "C. Bind iSCSI targets to the BMC port", "D. Enable HTTP compression on the SAN"],
    ans: "A",
    why: "Dedicated Layer 2 VLAN isolation removes LAN broadcast contention, while MTU 9000 wraps large block I/Os into fewer frames with lower CPU interrupt overhead.",

  scenarios.forEach(item => {
    if (currentDomain !== "ALL" && item.domain !== currentDomain) return;
    const blob = (item.q + " " + item.opts.join(" ") + " " + item.why + " " + item.trap).toLowerCase();
    if (query && !blob.includes(query)) return;

    shown++;
    const card = document.createElement("article");
    card.className = "card";
    const isAi = item.domain.startsWith("5.0");

    const optsHtml = item.opts.map(opt => {
      const isRight = opt.startsWith(item.ans + ".");
      return `<li class="opt ${isRight ? "correct-highlight" : ""}">${opt}</li>`;
    }).join("");

    card.innerHTML = `
      <div class="card-header">
        <span class="q-num">SCENARIO #${String(item.id).padStart(3, "0")}</span>
        <span class="domain-tag ${isAi ? "ai-tag" : ""}">${item.domain}</span>
      </div>
      <div class="scenario-text">${item.q}</div>
      <ul class="options-list">${optsHtml}</ul>
      <details ${allExpanded ? "open" : ""}>
        <summary>Inspect Root Cause &amp; Exam Logic (Answer: ${item.ans})</summary>
        <div class="answer-body">
          <div class="answer-verdict">Correct Answer: ${item.opts.find(o => o.startsWith(item.ans + "."))}</div>
          <div class="mechanism"><strong>Why it works this way:</strong> ${item.why}</div>
          <div class="trap-note"><strong>Exam Trap / Trigger:</strong> ${item.trap}</div>
        </div>
      </details>
    `;
    container.appendChild(card);
  });

  visibleCount.textContent = `Showing ${shown} of ${scenarios.length} scenarios`;
}

filterRow.addEventListener("click", e => {
  if (!e.target.classList.contains("chip")) return;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  e.target.classList.add("active");
  currentDomain = e.target.dataset.domain;
  render();
});

searchBox.addEventListener("input", render);

toggleAllBtn.addEventListener("click", () => {
  allExpanded = !allExpanded;
  toggleAllBtn.textContent = allExpanded ? "Collapse All" : "Expand All";
  document.querySelectorAll("details").forEach(d => {
    if (allExpanded) d.setAttribute("open", "");
    else d.removeAttribute("open");
  });
});

render();
</script>
</body>
</html>
