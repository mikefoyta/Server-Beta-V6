<script>
const scenarios = [
  // ================= DOMAIN 1.0: HARDWARE & INFRASTRUCTURE (101-120) =================
  {
    id: 101, domain: "1.0 Hardware & Infrastructure",
    q: "A blade server chassis houses 16 half-height compute blades sharing a midplane, six shared power supplies, and redundant chassis management modules. After inserting a new Fibre Channel mezzanine card into Blade 08, the blade cannot communicate with the SAN even though the card is detected in UEFI. What is missing in the rear of the blade enclosure?",
    opts: ["A. The matching Fibre Channel pass-through or interconnect switch module in the corresponding rear I/O fabric bay", "B. A dedicated 120V power cord plugged directly into Blade 08", "C. An external USB-to-SAS bridge", "D. A local CMOS jumper on the chassis midplane"],
    ans: "A",
    why: "Blade mezzanine cards route their signals across the chassis midplane directly to specific rear interconnect bays (Fabric A/B/C). If the matching rear I/O module is empty or populated with an Ethernet module instead of Fibre Channel, the mezzanine ports go nowhere.",
    trap: "Blade mezzanine card detected + no fabric link = verify matching rear chassis I/O interconnect bay."
  },
  {
    id: 102, domain: "1.0 Hardware & Infrastructure",
    q: "An administrator configures a server's BIOS Memory Sparing (Rank Sparing) mode on a system populated with dual-rank RDIMMs. When a single-bit ECC error threshold is exceeded on an active memory rank, what does the memory controller do automatically?",
    opts: ["A. Copies the contents of the failing rank to the reserved spare rank and takes the degraded rank offline before an uncorrectable multi-bit crash occurs", "B. Halves the memory bus clock to 1600 MT/s", "C. Reboots the server and disables ECC", "D. Mirrors all data onto the NVMe boot drive"],
    ans: "A",
    why: "Rank Sparing holds one rank per channel in reserve; when telemetry sees rising single-bit errors on an active rank, hardware transparently fails over to the spare rank without OS downtime.",
    trap: "Memory Mirroring = real-time 50% capacity duplicate; Rank Sparing = proactive hot-spare rank failover."
  },
  {
    id: 103, domain: "1.0 Hardware & Infrastructure",
    q: "A technician installs a replacement heatsink onto a 250W enterprise server CPU without cleaning off the dried old thermal paste and applies a thick blob of new compound on top. Under sustained load, the CPU hits 98°C and throttles. Why?",
    opts: ["A. Old crusted paste plus overly thick compound creates air pockets and high thermal resistance instead of filling microscopic metal surface imperfections", "B. Thermal paste conducts electricity and shorts CPU pins", "C. The BMC disables fan PWM when paste is thick", "D. Excess paste blocks PCIe lanes"],
    ans: "A",
    why: "Thermal Interface Material (TIM) is only meant to fill microscopic air gaps between the CPU IHS and heatsink base; metal-to-metal contact conducts heat far better than thick paste.",
    trap: "Always clean old TIM with isopropyl alcohol and apply a thin, even layer."
  },
  {
    id: 104, domain: "1.0 Hardware & Infrastructure",
    q: "A data center operations team implements hot-aisle containment using chimney ducts routing server rear exhaust directly into the ceiling return plenum. Why does hot-aisle containment typically achieve higher cooling efficiency than uncontained open aisles?",
    opts: ["A. It completely prevents hot exhaust air from mixing with cold supply air and returns hotter air to the CRAC coils, increasing thermodynamic heat-exchange efficiency", "B. It eliminates the need for server chassis fans", "C. It pressurizes the room with pure nitrogen", "D. It lowers server PSU voltage requirements"],
    ans: "A",
    why: "Separating cold supply and hot return streams stops hot spots and delivers a higher temperature differential (delta-T) back to CRAC/CRAH cooling coils, dramatically improving chiller efficiency.",
    trap: "Containment = zero hot/cold air mixing + higher CRAC return delta-T."
  },
  {
    id: 105, domain: "1.0 Hardware & Infrastructure",
    q: "A technician pulls a 2U server out on its sliding rack rails to replace a failed internal CMOS battery. Halfway through, the server stops sliding forward and locks with an audible click before clearing the rack posts. Why is this mechanical feature built into enterprise rails?",
    opts: ["A. Safety service-position latches prevent the heavy chassis from accidentally sliding completely off the rails and falling onto the technician", "B. The rails automatically ground the chassis via spring locks", "C. Cable management arms restrict rail travel to 12 inches", "D. Airflow sensors lock the rails while fans are spinning"],
    ans: "A",
    why: "Tool-less enterprise sliding rails feature intermediate service locks so you can safely open the top lid in the aisle without dropping a 60-lb server on your feet.",
    trap: "Always verify rail safety latches engage before servicing a slid-out server."
  },
  {
    id: 106, domain: "1.0 Hardware & Infrastructure",
    q: "A server is equipped with a Dual SD Card / Dual M.2 BOSS (Boot Optimized Storage Solution) hardware RAID 1 boot module. Why do enterprise architects boot hypervisors from an internal mirrored M.2/SD module instead of carving a boot partition out of the front 24-bay SAS/NVMe storage pool?",
    opts: ["A. It isolates the hypervisor OS from data arrays, leaves all 24 front hot-swap bays free for high-speed VM storage, and survives single boot-device failure", "B. SD cards have higher write endurance than enterprise U.3 NVMe drives", "C. Hypervisors cannot boot from SAS controllers", "D. It eliminates the need for UEFI firmware"],
    ans: "A",
    why: "Separating OS boot media onto a dedicated internal hardware RAID 1 carrier keeps all front drive bays dedicated to workload storage and simplifies full array rebuilds/migrations.",
    trap: "Dedicated mirrored internal boot module = OS isolation + maximum front bay capacity."
  },
  {
    id: 107, domain: "1.0 Hardware & Infrastructure",
    q: "During a generator failover drill, utility power drops, UPS units carry the load cleanly for 45 seconds, and the diesel backup generator starts up. However, when the Automatic Transfer Switch (ATS) connects the generator, several UPS units refuse to accept generator power and stay on battery until depleted. Why?",
    opts: ["A. Generator output frequency/voltage drifted outside the online UPS's narrow input acceptance window (dirty frequency slew rate)", "B. Diesel generators produce DC power instead of AC", "C. Server PSUs block generator sine waves", "D. The ATS disconnected the neutral ground bond permanently"],
    ans: "A",
    why: "Unloaded or poorly governed generators often experience frequency swings (e.g., 57–63 Hz) that double-conversion UPS rectifiers reject as out-of-spec power unless generator governor tuning or wider UPS input tolerances are configured.",
    trap: "UPS rejects generator power = frequency/voltage waveform out of UPS input tolerance."
  },
  {
    id: 108, domain: "1.0 Hardware & Infrastructure",
    q: "A colocation facility monitors environmental sensors at the top, middle, and bottom of every server rack. Which placement is the industry standard for measuring server intake compliance against ASHRAE thermal guidelines?",
    opts: ["A. Front (cold-aisle) intake side at top, middle, and bottom heights—specifically watching the top front intake where warm air tends to stratify", "B. Inside the PSU exhaust stream at the rear", "C. Under the raised floor directly beside the chiller pipe", "D. Inside the cable management tray"],
    ans: "A",
    why: "ASHRAE thermal envelopes specify temperature and humidity at the equipment air INLET (front), not the hot exhaust rear.",
    trap: "ASHRAE specs apply to FRONT cold-aisle intake air."
  },
  {
    id: 109, domain: "1.0 Hardware & Infrastructure",
    q: "An engineer connects a 100GbE QSFP28 transceiver into a switch uplink port using a multi-mode OM4 fiber patch cable, but the link stays down. Checking the optic label reveals '100GBASE-LR4 (1310nm)'. Why won't the link come up?",
    opts: ["A. LR4 is a long-range Single-Mode Fiber (SMF) optic requiring OS2 yellow single-mode fiber, not OM4 aqua multi-mode fiber", "B. QSFP28 ports only support copper DAC cables", "C. OM4 fiber requires SC connectors instead of LC", "D. 100GbE requires four separate fiber pairs"],
    ans: "A",
    why: "SR (Short Reach, 850nm) optics match Multi-Mode Fiber (OM3/OM4); LR (Long Reach, 1310nm) optics use narrow-core lasers designed strictly for Single-Mode Fiber (OS1/OS2).",
    trap: "SR = Multi-Mode (OM3/OM4); LR = Single-Mode (OS2). Never mismatch optics and fiber type."
  },
  {
    id: 110, domain: "1.0 Hardware & Infrastructure",
    q: "A server rack houses 20 1U servers, each requiring two Cat6A network uplinks and two redundant power cords. A technician bundles all 40 Ethernet cables tightly together with plastic zip ties and runs them directly alongside the high-current AC power whips. Intermittent packet CRC errors begin appearing. Why?",
    opts: ["A. Electromagnetic interference (EMI) from parallel AC power cords and crushed twist geometry from over-tightened zip ties degraded signal integrity", "B. Cat6A cables overheat when bundled in groups larger than 10", "C. Switch ports disable Auto-MDIX when cables are bundled", "D. AC power reverses Ethernet polarity"],
    ans: "A",
    why: "Running unshielded twisted-pair copper parallel to AC power introduces EMI crosstalk, and cinching zip ties crushes internal pair twist spacing (hook-and-loop Velcro straps must be used instead).",
    trap: "Use Velcro straps (never zip ties) on structured cabling and separate data from AC power."
  },
  {
    id: 111, domain: "1.0 Hardware & Infrastructure",
    q: "A newly installed server fails to boot from a PXE network boot server on a routed enterprise network. Servers on the same subnet as the PXE/WDS server boot fine, while servers on VLAN 50 time out waiting for DHCP/PXE offers. What router/switch setting is missing on VLAN 50?",
    opts: ["A. IP Helper-Address (DHCP Relay) pointing to the DHCP and PXE/WDS servers", "B. Spanning Tree BPDU Filter", "C. Port Mirroring (SPAN)", "D. BGP Passive Interface"],
    ans: "A",
    why: "PXE boot starts with a Layer 2 DHCP Discover broadcast. Routers drop broadcasts at subnet boundaries unless an IP Helper / DHCP Relay forwards them as unicast to the DHCP/PXE server.",
    trap: "PXE/DHCP works locally + fails across VLANs = configure IP Helper-Address (DHCP Relay)."
  },
  {
    id: 112, domain: "1.0 Hardware & Infrastructure",
    q: "A server motherboard features two onboard 10GBASE-T RJ45 ports and an OCP 3.0 (Open Compute Project) mezzanine slot. What is the primary operational advantage of using an OCP 3.0 NIC over a standard rear PCIe card?",

    ans: "A",
    why: "OCP 3.0 NICs slide into a dedicated chassis bay with an external thumbscrew/pull-tab, preserving full-height PCIe slots for accelerators and storage controllers.",
    trap: "OCP 3.0 = modular external-access server NIC saving PCIe expansion slots."
  },
  {
    id: 113, domain: "1.0 Hardware & Infrastructure",
    q: "An administrator configures an out-of-band BMC on a server and notices two options for network connectivity: 'Dedicated NIC' vs. 'Shared LOM (LAN on Motherboard)'. Why do security-conscious data centers mandate using the Dedicated BMC port?",
    opts: ["A. Physical air-gap isolation: management traffic stays on a physically separate switch/VLAN from production OS traffic, preventing guest compromises from reaching the BMC", "B. Shared LOM ports run at 10 Mbps half-duplex", "C. Dedicated NICs encrypt IPMI traffic without TLS", "D. Shared LOM disables BIOS updates"],
    ans: "A",
    why: "Shared LOM shares a single physical port and cable with production OS traffic via VLAN tagging, whereas a Dedicated BMC port provides physical cable-level separation onto the OOB management network.",
    trap: "Dedicated BMC NIC = true physical out-of-band isolation."
  },
  {
    id: 114, domain: "1.0 Hardware & Infrastructure",
    q: "A server chassis has redundant hot-swap fans labeled Fan 1 through Fan 6. When Fan 3 fails and is pulled out for replacement, the remaining five fans immediately jump to maximum RPM until the new fan clicks in. Why?",

    ans: "A",
    why: "N+1 cooling redundancy automatically ramps surviving fans to maintain required CFM airflow across heatsinks while a fan bay is empty or faulted.",
    trap: "Normal N+1 BMC thermal response during hot-swap fan maintenance."
  },
  {
    id: 115, domain: "1.0 Hardware & Infrastructure",
    q: "A technician is troubleshooting why a 4U storage server's rear redundant PSUs have amber blinking LEDs after a site relocation. Checking the facility specs reveals the new rack only supplies 110V–120V circuits, whereas the installed high-wattage 2400W PSUs are rated strictly for 200V–240V high-line input. Why won't they power up?",

    ans: "A",
    why: "Drawing 2400W at 120V would pull over 20A through a single cord; ultra-high-wattage PSUs require 208V/240V circuits (and heavy-duty C19/C20 cords).",
    trap: "High-wattage server PSUs (>1600W) = require 200V–240V high-line input."
  },
  {
    id: 116, domain: "1.0 Hardware & Infrastructure",
    q: "A data center installs an FM-200 / Novec 1230 clean-agent fire suppression system instead of wet-pipe water sprinklers in the main server hall. Why?",
    opts: ["A. Clean-agent gas extinguishes fires rapidly by absorbing heat/interrupting combustion without leaving conductive water or corrosive residue on live electronics", "B. Clean-agent gas cools servers down to -20°C", "C. Water sprinklers are illegal in commercial buildings", "D. Clean-agent gas doubles as UPS backup power"],
    ans: "A",
    why: "Clean-agent gaseous systems suppress electrical fires safely without destroying millions of dollars of live server hardware with water damage.",
    trap: "Server room fire suppression = clean agent (FM-200 / Novec 1230 / inert gas) or pre-action dry-pipe."
  },
  {
    id: 117, domain: "1.0 Hardware & Infrastructure",
    q: "A server is configured with UEFI Secure Boot enabled. When an administrator installs an unsigned third-party storage HBA kernel driver on Linux, the module fails to load with 'Required key not available'. Why?",

    why: "Secure Boot chains trust from UEFI firmware keys (PK/KEK/db) down into the OS kernel; unsigned drivers are rejected unless signed with a Machine Owner Key (MOK).",

    id: 121, domain: "2.0 Server Administration",

const container = document.getElementById("quizContainer");
const filterRow = document.getElementById("filterRow");
const searchBox = document.getElementById("searchBox");
const toggleAllBtn = document.getElementById("toggleAllBtn");
const visibleCount = document.getElementById("visibleCount");

let currentDomain = "ALL";
let allExpanded = false;

function render() {
  const query = searchBox.value.trim().toLowerCase();
  container.innerHTML = "";
  let shown = 0;

  scenarios.forEach(item => {
    if (currentDomain !== "ALL" && item.domain !== currentDomain) return;
    const blob = (item.q + " " + item.opts.join(" ") + " " + item.why + " " + item.trap).toLowerCase();
    if (query && !blob.includes(query)) return;

    shown++;
    const card = document.createElement("article");
    card.className = "card";
    const isAi = item.domain.startsWith("5.0");

    const optsHtml = item.opts.map(opt => {
      const isRight = opt.startsWith(item.ans + ".");
      return `<li class="opt ${isRight ? "correct-highlight" : ""}">${opt}</li>`;
    }).join("");

    card.innerHTML = `
      <div class="card-header">
        <span class="q-num">SCENARIO #${String(item.id).padStart(3, "0")}</span>
        <span class="domain-tag ${isAi ? "ai-tag" : ""}">${item.domain}</span>
      </div>
      <div class="scenario-text">${item.q}</div>
      <ul class="options-list">${optsHtml}</ul>
      <details ${allExpanded ? "open" : ""}>
        <summary>Inspect Root Cause &amp; Exam Logic (Answer: ${item.ans})</summary>
        <div class="answer-body">
          <div class="answer-verdict">Correct Answer: ${item.opts.find(o => o.startsWith(item.ans + "."))}</div>
          <div class="mechanism"><strong>Why it works this way:</strong> ${item.why}</div>
          <div class="trap-note"><strong>Exam Trap / Trigger:</strong> ${item.trap}</div>
        </div>
      </details>
    `;
    container.appendChild(card);
  });

  visibleCount.textContent = `Showing ${shown} of ${scenarios.length} scenarios`;
}

filterRow.addEventListener("click", e => {
  if (!e.target.classList.contains("chip")) return;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  e.target.classList.add("active");
  currentDomain = e.target.dataset.domain;
  render();
});

searchBox.addEventListener("input", render);

toggleAllBtn.addEventListener("click", () => {
  allExpanded = !allExpanded;
  toggleAllBtn.textContent = allExpanded ? "Collapse All" : "Expand All";
  document.querySelectorAll("details").forEach(d => {
    if (allExpanded) d.setAttribute("open", "");
    else d.removeAttribute("open");
  });
});

render();
</script>
